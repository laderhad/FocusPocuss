spO_sn2K-8zifnsEfluILX5pGgVEoE46aRRzlJAvasgyOp-DReDThTNkwpt1dOIovL44v11te98iUhGoQp672sJIPJCd_FqEs10WZFOdgUkk_-PSW4B9IyYxa3eSC_IwyiaNwhgqVDNzUn2ayI-MYmYHa6Sj375Hz98EWbo-OJthyT6h4sj6pKP-kpzF_Q80"><a class="font-headline-sm text-headline-sm tracking-tight text-primary hover:text-secondary transition-colors" data-path="launchpad" href="#">FocusPocuss</a></div><div class="flex items-center gap-space-lg"><nav class="flex items-center gap-space-lg" data-active-classes="text-primary font-medium"><a aria-current="page" class="transition-colors text-primary font-medium" data-path="launchpad" href="#">Başla</a><a class="font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors" data-path="progress" href="#">Geçmiş &amp; Ritim</a></nav><img alt="Profile" class="w-8 h-8 rounded-full object-cover" src="https://lh3.googleusercontent.com/aida/AEtjO1VSlxgRCR06X25xEp6G4w8Z_lkIQ2XXLETLSDqYJKKmwCoae4587Zg_v7xspO_sn2K-8zifnsEfluILX5pGgVEoE46aRRzlJAvasgyOp-DReDThTNkwpt1dOIovL44v11te98iUhGoQp672sJIPJCd_FqEs10WZFOdgUkk_-PSW4B9IyYxa3eSC_IwyiaNwhgqVDNzUn2ayI-MYmYHa6Sj375Hz98EWbo-OJthyT6h4sj6pKP-kpzF_Q80"></div></div></header><main class="w-full pt-16"><div class="max-w-5xl mx-auto px-gutter-mobile md:px-margin min-h-[calc(100vh-4rem)] flex flex-col justify-between"><div class="flex flex-col w-full">
<section class="relative w-full py-space-xl flex flex-col items-center justify-center overflow-hidden">
<!-- Ambient field blur & quiet mineral glow -->
<div class="absolute -top-24 left-1/2 -translate-x-1/2 w-[38rem] h-[22rem] bg-secondary-container/20 rounded-full blur-3xl pointer-events-none -z-10"></div>
<div class="absolute top-1/2 -left-20 w-72 h-72 bg-tertiary-fixed/30 rounded-full blur-3xl pointer-events-none -z-10"></div>
<div class="w-full max-w-3xl flex flex-col items-start px-gutter-mobile md:px-0">
<!-- Top Reference: The Overwhelming Thought -->

<!-- Confident Editorial Pivot -->
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight mt-space-sm mb-space-xl">
        Bunu küçültelim.
      </h1>
<!-- Visual Focus Field / Distillation Graphic -->
<div class="w-full mb-space-xl relative flex flex-col items-center justify-center py-space-lg"><svg class="w-full max-w-lg h-24 overflow-visible" fill="none" viewBox="0 0 520 90" xmlns="http://www.w3.org/2000/svg">
  <!-- Gathering State: Organic topographic contours actively drawing inward toward center -->
  <path d="M 40,45 Q 150,18 260,40 Q 370,62 480,45" stroke="#727876" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="2 4"></path>
  <path d="M 80,45 C 150,28 200,38 260,43 C 320,48 370,58 440,45" stroke="#40655c" stroke-width="1.2" stroke-opacity="0.45"></path>
  <path d="M 130,45 C 180,35 220,41 260,44 C 300,47 340,53 390,45" stroke="#40655c" stroke-width="1.5" stroke-opacity="0.7"></path>
  <path d="M 180,45 C 215,40 240,43 260,45 C 280,47 305,50 340,45" stroke="#243B36" stroke-width="1.75" stroke-opacity="0.95"></path>
  <!-- Coherent gathering nodes focusing at center point -->
  <circle cx="246" cy="44.5" r="1.5" fill="#243B36" fill-opacity="0.6"></circle>
  <circle cx="260" cy="45" r="3" fill="#243B36"></circle>
  <circle cx="274" cy="45.5" r="1.5" fill="#243B36" fill-opacity="0.6"></circle>
</svg></div>
<!-- Core Transformation Container (Limestone Cardless Plane) -->
<div class="w-full bg-surface-container-low/70 border border-[#E6E2D8] rounded-[16px] p-6 md:p-8 shadow-sm transition-all duration-300" id="transformation-card">
<!-- Context Label -->
<div class="flex items-center justify-between"><div class="flex items-center gap-2">
  <span class="w-2 h-2 rounded-full bg-secondary"></span>
  <span class="text-[11px] font-semibold tracking-wider uppercase text-secondary font-['Work_Sans']">Şimdi sadece şunu yap:</span>
</div>
<div class="inline-flex items-center gap-1.5 px-3 py-1 bg-surface border border-[#E6E2D8] rounded-full text-secondary">
  <span class="material-symbols-outlined text-[14px]">hourglass_empty</span>
  <span class="text-[12px] font-medium tracking-tight font-['Work_Sans']" id="task-duration">12 dakika</span>
</div></div>
<!-- The One Tiny Next Physical Action -->
<p class="font-headline-md text-2xl md:text-[1.75rem] text-[#202522] leading-snug my-6 select-text" id="task-title">
          “AVL tree dosyasını aç ve mevcut implementasyonu oku.”
        </p>
<!-- Supportive Micro Guidance -->

<!-- Actions Row -->
<div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-space-md pt-space-sm"><button class="group inline-flex items-center justify-center gap-2 bg-[#243B36] text-white hover:bg-[#1b2d29] px-6 py-3 rounded-[8px] transition-colors duration-150" id="btn-start" type="button">
  <span class="text-[13px] font-medium tracking-wide font-['Work_Sans']">Odaklanmaya başla</span>
  <span class="material-symbols-outlined text-base transition-transform group-hover:translate-x-0.5">arrow_forward</span>
</button>
<button class="group inline-flex items-center justify-center gap-1.5 py-2 px-2 text-secondary hover:text-[#202522] transition-colors" id="btn-shrink" type="button">
  <span class="material-symbols-outlined text-base text-secondary/80 group-hover:text-[#202522]">unfold_less</span>
  <span class="text-[13px] font-medium font-['Work_Sans'] border-b border-secondary/30 group-hover:border-[#202522] pb-0.5">Daha da küçült</span>
</button></div>
</div>
<!-- Intellectual Endurance Note / Archival Footnote -->

</div>
</section>
<!-- Interactive script handling progressive micro-step distillation -->
<script>
    (function () {
      const steps = [
        {
          duration: "12 dakika",
          title: "“AVL tree dosyasını aç ve mevcut implementasyonu oku.”",
          subtext: "Kod yazma zorunluluğu yok. Sadece fonksiyon tanımlarına ve düğüm yapısına göz gezdirmen yeterli. Zihnin gerisini kendiliğinden halledecektir."
        },
        {
          duration: "5 dakika",
          title: "“Sadece kod editörünü ve ödev PDF'ini yan yana yerleştir.”",
          subtext: "Hiçbir mantık kurma. Masandaki suyu tazele, pencereleri hizala ve dosyayı önünde açık bırak."
        },
        {
          duration: "2 dakika",
          title: "“Proje klasörünü aç ve main.cpp içine bir yorum satırı ekle.”",
          subtext: "Yalnızca bugünün tarihini ve adını yaz. Eylemin eşiğini sıfıra indiriyoruz."
        }
      ];

      let currentStep = 0;
      const shrinkBtn = document.getElementById("btn-shrink");
      const titleEl = document.getElementById("task-title");
      const durationEl = document.getElementById("task-duration");
      const subtextEl = document.getElementById("task-subtext");
      const cardEl = document.getElementById("transformation-card");

      if (shrinkBtn && titleEl && durationEl && subtextEl) {
        shrinkBtn.addEventListener("click", function () {
          currentStep = (currentStep + 1) % steps.length;
          const next = steps[currentStep];

          cardEl.classList.add("opacity-50");
          setTimeout(() => {
            durationEl.textContent = next.duration;
            titleEl.textContent = next.title;
            subtextEl.textContent = next.subtext;
            cardEl.classList.remove("opacity-50");
          }, 120);

          if (currentStep === steps.length - 1) {
            shrinkBtn.querySelector("span:last-child").textContent = "En küçük boyutta (Başa dön)";
          } else {
            shrinkBtn.querySelector("span:last-child").textContent = "Daha da küçült";
          }
        });
      }

      const startBtn = document.getElementById("btn-start");
      if (startBtn) {
        startBtn.addEventListener("click", function () {
          startBtn.classList.add("bg-secondary");
          const label = startBtn.querySelector("span:first-child");
          if (label) label.textContent = "Odağa geçiliyor...";
        });
      }
    })();
  </script>
</div></div></main>
