<div class="flex flex-col items-start md:items-center justify-center my-auto w-full max-w-2xl px-space-md text-left md:text-center"><div class="font-label-sm text-label-sm uppercase tracking-widest text-outline mb-space-xs font-medium select-none">Şimdi</div><h1 class="font-headline-lg text-headline-lg text-primary tracking-tight max-w-xl leading-tight mb-space-xs">AVL tree implementasyonunu aç</h1><p class="font-body-sm text-body-sm text-on-surface-variant mb-space-xl max-w-lg leading-relaxed">Sol-sağ rotasyon mantığını tek bir fonksiyonda toparla ve denge faktörünü doğrula.</p><div class="relative flex items-center justify-center w-80 h-80 my-space-sm mx-auto select-none"><svg class="absolute inset-0 w-full h-full pointer-events-none overflow-visible" fill="none" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg"><path d="M 160 26 C 224 24, 280 62, 294 128 C 307 186, 276 254, 212 284 C 156 310, 88 295, 44 248 C 0 200, 16 118, 68 64 C 94 37, 126 27, 160 26 Z" stroke="#52776D" stroke-width="1.1" stroke-dasharray="3 5" opacity="0.4"></path><path d="M 163 56 C 214 50, 260 88, 265 146 C 270 204, 233 255, 172 259 C 115 263, 64 228, 58 168 C 52 112, 95 64, 163 56 Z" stroke="#52776D" stroke-width="1.3" opacity="0.75"></path><path d="M 161 92 C 198 88, 228 116, 226 158 C 224 198, 195 223, 158 221 C 122 219, 98 194, 102 156 C 106 120, 128 94, 161 92 Z" stroke="#243B36" stroke-width="1" opacity="0.35"></path><circle cx="278" cy="118" r="1" fill="#52776D" opacity="0.4"></circle><circle cx="52" cy="220" r="1.2" fill="#243B36" opacity="0.35"></circle></svg><div class="flex flex-col items-center justify-center z-10"><div class="font-headline-md text-headline-md font-light tracking-widest text-primary font-mono tabular-nums" id="session-timer">18:36</div><button class="font-label-sm text-label-sm text-outline hover:text-secondary mt-space-sm underline underline-offset-4 transition-colors cursor-pointer bg-transparent border-0" id="toggle-timer-btn">Süreyi gizle</button></div></div><div class="flex flex-col sm:flex-row items-center gap-space-md justify-center w-full mt-space-md mx-auto"><button class="w-full sm:w-auto px-space-xl py-space-md bg-primary-container text-on-primary rounded-lg font-label-md text-label-md hover:bg-primary transition-colors cursor-pointer shadow-sm active:translate-y-px" id="complete-btn" style="background-color: rgb(36, 59, 54); border-radius: 8px;">Bu adım bitti</button><button class="w-full sm:w-auto px-space-lg py-space-md bg-transparent text-on-surface-variant hover:text-primary rounded-lg font-label-md text-label-md hover:bg-surface-container transition-colors cursor-pointer" id="distraction-btn">Dikkatim dağıldı</button></div><div class="mt-space-md text-on-tertiary-container font-body-sm text-body-sm opacity-0 transition-opacity duration-300 mx-auto" id="distraction-feedback">Fark etmen yeterli. Nefes al ve satıra geri dön.</div></div>

</div>
<script>
  (function() {
    let secondsLeft = 18 * 60 + 42;
    let timerVisible = true;
    let isRunning = true;
    const timerElement = document.getElementById('session-timer');
    const toggleButton = document.getElementById('toggle-timer-btn');
    const completeButton = document.getElementById('complete-btn');
    const distractionButton = document.getElementById('distraction-btn');
    const distractionFeedback = document.getElementById('distraction-feedback');
    const pauseExitBtn = document.getElementById('pause-exit-btn');

    function formatTime(totalSecs) {
      const mins = Math.floor(totalSecs / 60);
      const secs = totalSecs % 60;
      return String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
    }

    const intervalId = setInterval(function() {
      if (isRunning && secondsLeft > 0) {
        secondsLeft--;
        if (timerVisible) {
          timerElement.textContent = formatTime(secondsLeft);
        }
      }
    }, 1000);

    toggleButton.addEventListener('click', function() {
      timerVisible = !timerVisible;
      if (timerVisible) {
        timerElement.textContent = formatTime(secondsLeft);
        toggleButton.textContent = 'Süreyi gizle';
      } else {
        timerElement.textContent = '••:••';
        toggleButton.textContent = 'Süreyi göster';
      }
    });

    distractionButton.addEventListener('click', function() {
      distractionFeedback.classList.remove('opacity-0');
      distractionFeedback.classList.add('opacity-100');
      setTimeout(function() {
        distractionFeedback.classList.remove('opacity-100');
        distractionFeedback.classList.add('opacity-0');
      }, 4000);
    });

    completeButton.addEventListener('click', function() {
      completeButton.textContent = 'Kaydedildi ✓';
      completeButton.classList.add('bg-secondary');
      setTimeout(function() {
        completeButton.textContent = '[ Bu adım bitti ]';
        completeButton.classList.remove('bg-secondary');
      }, 1500);
    });

    pauseExitBtn.addEventListener('click', function() {
      isRunning = !isRunning;
      const textSpan = pauseExitBtn.querySelector('span:last-child');
      const iconSpan = pauseExitBtn.querySelector('.material-symbols-outlined');
      if (isRunning) {
        textSpan.textContent = 'Duraklat / Çıkış';
        iconSpan.textContent = 'pause';
      } else {
        textSpan.textContent = 'Devam Et';
        iconSpan.textContent = 'play_arrow';
      }
    });
  })();
</script></main>
